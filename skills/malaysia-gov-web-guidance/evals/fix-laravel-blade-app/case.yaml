schema_version: "1.1"
name: fix-laravel-blade-app
expected_outcome: |
  The Laravel/Blade app is fixed in views, components and controllers, not admin-editable HTML: the
  now() About Us timestamp and the d/m/Y news timestamp become real updated_at values in full
  YYYY-MM-DD HH:MM:SS; contact details and FAQ get real timestamps; the search tag moves from the
  component wrapper <div> and the feedback tag from the button <i> onto their <form> elements; the
  splwpk-privacy-polisy typo stored in settings.footer_html is fixed (tagged links printed from Blade,
  with a migration for the stored value); the sitemap tag inside a Blade {{-- --}} comment is restored;
  splwpk-multilang is no longer added by Alpine x-bind, and the notes say the multi-language criterion
  needs real English content (the site is BM-only); one <h1>, title under 70, meta description,
  viewport, banner alt, and exactly https://www.malaysia.gov.my. No invented tags, URLs or dates.
  Baseline from stress-test round 7: 27 scan fails before; 11 with the skill (EN and BM runs alike,
  all needing real council URLs), 17 without.
context:
  scaffold_script: place-files.sh
