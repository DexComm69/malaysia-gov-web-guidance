name: myds-index
# Weekly check that references/myds-index.json still matches the MYDS documentation site.
# A failed run means MYDS added, renamed or removed pages: run `python scripts/mgwg.py update-index --write`
# in skills/malaysia-gov-web-guidance and commit the result.
on:
  schedule:
    - cron: '0 1 * * 1'   # Mondays, 09:00 Malaysia time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare the index with the live MYDS navigation
        run: python skills/malaysia-gov-web-guidance/scripts/mgwg.py update-index --fail-on-change
